<!doctype html>
<meta charset="utf-8">
<title>owner</title>
<body style="font: 13px/1.5 system-ui; padding: 12px">
<h1 style="font-size: 15px">Owner window</h1>
<p>Hidden in the real application. Shown here so the example is inspectable.</p>
<pre id="log" style="background: #f4f4f4; padding: 8px; max-height: 300px; overflow: auto"></pre>
<script type="importmap">
{
  "imports": {
    "@globals/core": "/packages/core/dist/src/index.js"
  }
}
</script>
<script type="module">
import { startOwner } from "../../../packages/electron/dist/src/owner.js";

const log = (line) => {
  const element = document.getElementById("log");
  element.textContent = `${line}\n${element.textContent}`.split("\n").slice(0, 40).join("\n");
};

const ROWS = 5000;

const runtime = startOwner({
  initial: {
    title: "Five thousand rows",
    selected: 0,
    rows: Array.from({ length: ROWS }, (_unused, id) => ({
      id,
      name: `record ${id}`,
      score: id % 100,
      active: id % 7 !== 0,
    })),
  },
  operations: {
    // Every write a window can request is declared here. That is what makes the write
    // surface reviewable, and it is why a window cannot send a recipe.
    rename(draft, payload) {
      const row = draft.rows[payload.id];
      if (row) row.name = payload.name;
    },
    setScore(draft, payload) {
      const row = draft.rows[payload.id];
      if (row) row.score = payload.score;
    },
    toggle(draft, payload) {
      const row = draft.rows[payload.id];
      if (row) row.active = !row.active;
    },
    select(draft, payload) {
      draft.selected = payload.id;
    },
    bumpAll(draft) {
      for (const row of draft.rows) row.score = (row.score + 1) % 100;
    },
  },
  arena: {
    byteLength: 4 << 20,
    maxByteLength: 64 << 20,
    maxReaders: 16,
    retainedVersions: 64,
    // Time travel costs memory, so it is off by default. On here because the example has a
    // history panel.
    historyDepth: 16,
  },
  // Any window whose name starts with untrusted gets the asynchronous tier and never sees
  // the buffer. See docs/trust-model.md.
  asyncOnly: (name) => name.startsWith("untrusted-"),
  onCommit: (version) => {
    if (version % 25 === 0) log(`version ${version}, ${runtime.stats().peers} peers`);
  },
});

log(`owner started with ${ROWS} rows`);
</script>
