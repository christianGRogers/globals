<!doctype html>
<meta charset="utf-8">
<title>table</title>
<body style="font: 13px/1.4 system-ui; margin: 0">
<div style="padding: 10px; border-bottom: 1px solid #ddd">
  <strong id="title"></strong>
  <span id="meta" style="color: #666; margin-left: 10px"></span>
  <button id="bump" style="margin-left: 10px">Bump every score</button>
</div>
<div id="viewport" style="height: calc(100vh - 46px); overflow: auto">
  <div id="spacer"><table id="grid" style="border-collapse: collapse; width: 100%"></table></div>
</div>
<script type="importmap">
{
  "imports": {
    "@globals/core": "/packages/core/dist/src/index.js"
  }
}
</script>
<script type="module">
import { connect } from "../../../packages/electron/dist/src/renderer.js";

const store = await connect({ name: "table" });
if (store.tier !== "shared") throw new Error("this window expected the shared tier");

const ROW_HEIGHT = 22;
const OVERSCAN = 6;
const viewport = document.getElementById("viewport");
const grid = document.getElementById("grid");
const spacer = document.getElementById("spacer");

function render() {
  // The point of the example. A synchronous read on the render path, no await, no
  // replicated copy of five thousand rows in this window.
  const state = store.get();
  const rows = state.rows;
  const total = rows.length;

  document.getElementById("title").textContent = state.title;
  spacer.style.height = `${total * ROW_HEIGHT}px`;

  const first = Math.max(0, Math.floor(viewport.scrollTop / ROW_HEIGHT) - OVERSCAN);
  const visible = Math.ceil(viewport.clientHeight / ROW_HEIGHT) + OVERSCAN * 2;
  const last = Math.min(total, first + visible);

  document.getElementById("meta").textContent =
    `version ${store.version}, showing ${first} to ${last} of ${total}`;

  const html = [];
  for (let index = first; index < last; index += 1) {
    // Only the visible rows are decoded. The other four thousand nine hundred stay as bytes.
    const row = rows[index];
    const highlight = index === state.selected ? "background: #fffbdd" : "";
    html.push(
      `<tr data-id="${row.id}" style="height: ${ROW_HEIGHT}px; ${highlight}">` +
        `<td style="width: 70px; color: #999">${row.id}</td>` +
        `<td>${row.name}</td>` +
        `<td style="width: 70px; text-align: right">${row.score}</td>` +
        `<td style="width: 70px; color: ${row.active ? "#276749" : "#9b2c2c"}">` +
        `${row.active ? "active" : "paused"}</td></tr>`,
    );
  }

  grid.style.transform = `translateY(${first * ROW_HEIGHT}px)`;
  grid.innerHTML = html.join("");
}

viewport.addEventListener("scroll", render, { passive: true });
store.subscribe(render);
document.getElementById("bump").addEventListener("click", () => void store.dispatch("bumpAll"));
grid.addEventListener("click", (event) => {
  const row = event.target.closest("tr");
  if (row) void store.dispatch("select", { id: Number(row.dataset.id) });
});

render();
</script>
