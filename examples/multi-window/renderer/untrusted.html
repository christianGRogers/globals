<!doctype html>
<meta charset="utf-8">
<title>plugin</title>
<body style="font: 13px/1.6 system-ui; padding: 14px">
<h1 style="font-size: 15px; margin: 0 0 8px">Plugin window, asynchronous tier</h1>
<p style="color: #666">
  This window was named <code>untrusted-plugin</code>, so the owner never sent it the buffer.
  It cannot corrupt shared state, and it pays for that with asynchronous reads.
</p>

<pre id="tier" style="background: #f4f4f4; padding: 8px"></pre>
<p><button id="write">Write anyway</button> <span id="result" style="color: #666"></span></p>
<pre id="state" style="background: #f4f4f4; padding: 8px; max-height: 220px; overflow: auto"></pre>

<script type="module">
import { connect } from "../../../packages/electron/dist/src/renderer.js";

const store = await connect();

document.getElementById("tier").textContent = [
  `tier                 ${store.tier}`,
  `has a synchronous get ${"get" in store}`,
  `crossOriginIsolated   ${self.crossOriginIsolated}`,
  ``,
  store.tier === "async"
    ? "There is no synchronous read on this object. That is the opt out, in the type system."
    : "Unexpected: this window was supposed to be on the asynchronous tier.",
].join("\n");

async function render() {
  const state = await store.read();
  document.getElementById("state").textContent = JSON.stringify(
    { title: state.title, selected: state.selected, rows: `${state.rows.length} rows` },
    null,
    2,
  );
}

// Writes still work. The opt out is about reading shared memory, not about being trusted to
// ask for a write the owner has declared.
document.getElementById("write").addEventListener("click", async () => {
  const result = document.getElementById("result");
  try {
    await store.dispatch("select", { id: Math.floor(Math.random() * 5000) });
    result.textContent = "the write was applied by the owner";
  } catch (error) {
    result.textContent = error.message;
  }
});

store.subscribe(() => void render());
await render();
</script>
