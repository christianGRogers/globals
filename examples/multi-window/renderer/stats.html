<!doctype html>
<meta charset="utf-8">
<title>arena</title>
<body style="font: 12px/1.5 ui-monospace, monospace; padding: 12px">
<h1 style="font: 600 14px system-ui; margin: 0 0 8px">This window</h1>
<pre id="reader" style="background: #f4f4f4; padding: 8px; margin: 0"></pre>

<h1 style="font: 600 14px system-ui; margin: 16px 0 6px">History</h1>
<p style="font: 12px system-ui; color: #666; margin: 0 0 8px">
  The versions the ring still holds. Retention is bounded, so this is a debugging aid and
  not an undo stack. Click one to see what changed at the top level.
</p>
<div id="history"></div>
<pre id="diff" style="background: #f4f4f4; padding: 8px; margin-top: 8px"></pre>

<script type="importmap">
{
  "imports": {
    "@globals/core": "/packages/core/dist/src/index.js"
  }
}
</script>
<script type="module">
import { connect } from "../../../packages/electron/dist/src/renderer.js";
import {
  ArenaReader,
  VersionHistory,
  diffShallow,
  reportReader,
} from "../../../packages/core/dist/src/index.js";

const store = await connect({ name: "stats" });
if (store.tier !== "shared") throw new Error("this window expected the shared tier");

// A debug panel browses history through its own reader. A reader owns one epoch slot, so
// pinning a past version through the render reader would suspend the pin the render holds.
const inspector = ArenaReader.attach(store.buffer, { heartbeat: false });
const history = new VersionHistory(inspector);

function renderReader() {
  const report = reportReader(store.reader);
  document.getElementById("reader").textContent = [
    `slot              ${report.slot}`,
    `generation        ${report.generation}`,
    `pinned version    ${report.pinnedEpoch}`,
    `published version ${report.publishedVersion}`,
    `reclaim floor     ${report.reclaimFloor}`,
    `lag               ${report.lagVersions} versions`,
    `headroom          ${report.headroomVersions} before a forced advance`,
  ].join("\n");
}

function renderHistory() {
  const entries = history.list().slice(-12).reverse();
  document.getElementById("history").innerHTML = entries
    .map(
      (entry) =>
        `<button data-version="${entry.versionId}" style="margin: 2px">v${entry.versionId}</button>`,
    )
    .join("");
}

document.getElementById("history").addEventListener("click", (event) => {
  const version = Number(event.target.dataset?.version);
  if (!version) return;
  const output = document.getElementById("diff");
  try {
    const before = history.read(version - 1);
    const after = history.read(version);
    const changes = diffShallow(before, after);
    output.textContent =
      changes.length === 0
        ? `version ${version} changed nothing at the top level`
        : changes
            .map((change) => `${change.key}: changed`)
            .join("\n");
  } catch (error) {
    // The expected failure, and worth showing rather than hiding: the version fell off the
    // ring while the panel was open.
    output.textContent = `${error.name}: ${error.message}`;
  }
});

store.subscribe(() => {
  renderReader();
  renderHistory();
});
setInterval(renderReader, 500);
renderReader();
renderHistory();

window.addEventListener("beforeunload", () => inspector.detach());
</script>
