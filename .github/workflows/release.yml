name: release

# Publishing happens from a tag on main. The repository owner performs the merge from a
# release branch into main and pushes the tag, so this workflow never decides to release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - run: npm test
      - run: node scripts/check-docs.mjs
      - name: the tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "tag is not an ancestor of main, refusing to publish"
            exit 1
          fi
      # Checks the tag against every package, not just core, and checks the internal pins
      # with it. A release that bumps the six versions but misses the five exact
      # cross-package pins publishes without complaint and then resolves
      # @bradensbay/globals against the previous globals-core. Runnable locally, which is
      # the point: this is the second tag to learn a precondition the hard way.
      - name: the tag, the versions, and the internal pins must agree
        run: node scripts/check-release.mjs "${{ github.ref_name }}"

  prebuild:
    name: build the transport prebuilds
    needs: verify
    uses: ./.github/workflows/prebuilds.yml

  publish:
    name: publish to npm
    needs: [verify, prebuild]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: fold the prebuilds into the transport package
        uses: actions/download-artifact@v7
        with:
          pattern: prebuild-*
          path: packages/shm/native/prebuilds
          merge-multiple: true
      - name: a release without every prebuild does not ship
        run: |
          ls -R packages/shm/native/prebuilds
          for pair in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            test -f "packages/shm/native/prebuilds/$pair/globals_shm.node" || { echo "missing $pair"; exit 1; }
          done
      - name: publish every public workspace package
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
