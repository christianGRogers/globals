name: electron-matrix

# The buffer sharing spike measured its answer: the gate FAILED, finally, for the reason
# recorded in spikes/RESULTS.md. This workflow no longer asks whether the spike passes. It
# asks whether the answer has CHANGED, which is the only event worth an alarm: a Chromium
# that lets the buffer cross would make the original design viable again. A job here goes
# red when the measured verdict stops matching the record, not when the platform behaves
# as documented.
#
# The native gates are the affirmative half: spike 08 answers whether the transport works on
# a given major and platform, and the e2e and chaos apps answer whether the library built on
# it does. Node-API is ABI stable, so a failure here means Electron changed something the
# stability document says it watches, which is exactly what a matrix is for.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "spikes/01-share-buffer/**"
      - "spikes/08-mmap-accessor/**"
      - "packages/shm/**"
      - "packages/electron/**"
      - ".github/workflows/electron-matrix.yml"

permissions:
  contents: read

jobs:
  share-buffer-verdict:
    name: spike 01 verdict check, electron ${{ matrix.electron }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        electron: ["42", "43", "44"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save electron@^${{ matrix.electron }}
      # Electron stopped unpacking its binary during npm install: it materialises on the
      # first require, which used to be inside the run step below. The sandbox step then
      # ran while there was nothing to configure, said so, and carried on, and Electron
      # aborted at launch because chrome-sandbox was neither root owned nor setuid.
      # Resolving the binary here puts it on disk before anything tries to configure it.
      - name: materialise the Electron binary
        shell: bash
        run: node -e "import('electron').then((m) => console.log(m.default))"
      - name: configure the SUID sandbox helper the Linux image requires
        if: runner.os == 'Linux'
        shell: bash
        # A missing helper is a hard error, not a note. Skipping quietly is exactly what
        # turned this into a crash forty lines later instead of a failure where it broke.
        run: |
          helper=node_modules/electron/dist/chrome-sandbox
          if [ ! -e "$helper" ]; then
            echo "::error::$helper is missing after resolving the Electron binary, so Electron cannot start on Linux."
            exit 1
          fi
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: run the sharing spike, expecting the recorded FAIL
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            runner="xvfb-run --auto-servernum"
          else
            runner=""
          fi
          if $runner node spikes/run-spike.mjs 01; then
            echo "::error::spike 01 PASSED. The recorded verdict has changed: a SharedArrayBuffer reached a sandboxed renderer in another process. Reread spikes/RESULTS.md and ADR 0002, because the original design may be viable on this Electron."
            exit 1
          fi
          # A crash also exits nonzero, and a broken run must not masquerade as the measured
          # answer: the report has to exist and carry the verdict.
          node -e "const r=require('./spikes/01-share-buffer/spike01-result.json'); process.exit(r.verdict==='FAIL'?0:1)"
          echo "the verdict matches the record: FAIL, as spikes/RESULTS.md states"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike01-${{ matrix.os }}-electron${{ matrix.electron }}
          path: spikes/01-share-buffer/spike01-result.json

  native-gates:
    name: native gates, electron ${{ matrix.electron }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        electron: ["42", "43", "44"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - run: npm install --no-save electron@^${{ matrix.electron }}
      # Electron stopped unpacking its binary during npm install: it materialises on the
      # first require, which used to be inside the run step below. The sandbox step then
      # ran while there was nothing to configure, said so, and carried on, and Electron
      # aborted at launch because chrome-sandbox was neither root owned nor setuid.
      # Resolving the binary here puts it on disk before anything tries to configure it.
      - name: materialise the Electron binary
        shell: bash
        run: node -e "import('electron').then((m) => console.log(m.default))"
      - name: configure the SUID sandbox helper the Linux image requires
        if: runner.os == 'Linux'
        shell: bash
        # A missing helper is a hard error, not a note. Skipping quietly is exactly what
        # turned this into a crash forty lines later instead of a failure where it broke.
        run: |
          helper=node_modules/electron/dist/chrome-sandbox
          if [ ! -e "$helper" ]; then
            echo "::error::$helper is missing after resolving the Electron binary, so Electron cannot start on Linux."
            exit 1
          fi
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: build the spike 08 addon
        shell: bash
        run: cd spikes/08-mmap-accessor && npx node-gyp rebuild
      - name: spike 08, the transport go or no go for this major
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run --auto-servernum"; else runner=""; fi
          $runner node spikes/run-spike.mjs 08
      - name: the e2e gate, nineteen checks against real windows
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run --auto-servernum"; else runner=""; fi
          $runner node scripts/run-electron.mjs packages/electron/test/native-e2e-app/main.mjs \
            --report packages/electron/test/native-e2e-app/e2e-result.json
      - name: window lifecycle chaos, sixty seconds
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run --auto-servernum"; else runner=""; fi
          $runner node scripts/run-electron.mjs packages/electron/test/native-chaos-app/main.mjs \
            --report packages/electron/test/native-chaos-app/chaos-result.json --seconds 60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gates-${{ matrix.os }}-electron${{ matrix.electron }}
          path: |
            spikes/08-mmap-accessor/spike08-result.json
            packages/electron/test/native-e2e-app/e2e-result.json
            packages/electron/test/native-chaos-app/chaos-result.json

  canary-verdict:
    name: spike 01 verdict check against the newest Electron prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The prerelease exceeds the workspace's declared peer range on purpose; that is what
      # makes it a canary. It is resolved rather than named, because `electron@beta` is not
      # reliably ahead of the matrix: between a major going stable and the next major's betas
      # opening, that tag still points at a prerelease of the version that already shipped,
      # and a canary running behind the matrix is worse than no canary. See the script.
      - name: resolve the newest Electron prerelease
        id: canary
        shell: bash
        run: |
          version=$(node scripts/newest-electron.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the canary runs against electron@$version"
      - run: npm install --no-save --legacy-peer-deps electron@${{ steps.canary.outputs.version }}
      # Electron stopped unpacking its binary during npm install: it materialises on the
      # first require, which used to be inside the run step below. The sandbox step then
      # ran while there was nothing to configure, said so, and carried on, and Electron
      # aborted at launch because chrome-sandbox was neither root owned nor setuid.
      # Resolving the binary here puts it on disk before anything tries to configure it.
      - name: materialise the Electron binary
        shell: bash
        run: node -e "import('electron').then((m) => console.log(m.default))"
      - name: configure the SUID sandbox helper the Linux image requires
        if: runner.os == 'Linux'
        shell: bash
        # A missing helper is a hard error, not a note. Skipping quietly is exactly what
        # turned this into a crash forty lines later instead of a failure where it broke.
        run: |
          helper=node_modules/electron/dist/chrome-sandbox
          if [ ! -e "$helper" ]; then
            echo "::error::$helper is missing after resolving the Electron binary, so Electron cannot start on Linux."
            exit 1
          fi
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: the earliest signal available that the answer changed
        shell: bash
        run: |
          if xvfb-run --auto-servernum node spikes/run-spike.mjs 01; then
            echo "::warning::spike 01 PASSED on electron@${{ steps.canary.outputs.version }}. The next major may change the recorded answer."
            exit 1
          fi
          echo "the prerelease matches the record: FAIL"
      - name: the native transport against the prerelease, failure here is the real warning
        shell: bash
        run: |
          npm run build:native
          npm run build
          cd spikes/08-mmap-accessor && npx node-gyp rebuild && cd ../..
          xvfb-run --auto-servernum node spikes/run-spike.mjs 08
          xvfb-run --auto-servernum node scripts/run-electron.mjs \
            packages/electron/test/native-e2e-app/main.mjs \
            --report packages/electron/test/native-e2e-app/e2e-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike01-canary
          path: spikes/01-share-buffer/spike01-result.json
