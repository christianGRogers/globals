name: prebuilds

# Builds the @bradensbay/globals-shm addon for every supported platform and architecture, smoke tests
# each binary on the machine that built it, and uploads the results as artifacts. Node-API
# binaries are ABI stable, so one binary per platform-arch pair serves every supported Node
# and Electron. The release workflow calls this and folds the artifacts into the published
# package, and refuses to ship without all six.
#
# darwin-x64 is cross compiled from the arm runner, because GitHub retired the free Intel
# macOS runners: the job that asked for one sat in the queue forever. The cross built binary
# cannot run on the machine that built it, so it gets an architecture check instead of the
# smoke test, and Rosetta users get their binary either way.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "packages/shm/native/**"
      - ".github/workflows/prebuilds.yml"

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  prebuild:
    name: ${{ matrix.os }}${{ matrix.target_arch && format(', cross to {0}', matrix.target_arch) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-latest
            target_arch: x64
          - os: windows-latest
          - os: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the addon
        shell: bash
        # Through the package script, not npx: npm exec inside a workspace member resets the
        # working directory to the member's root, and gyp then cannot find binding.gyp.
        run: |
          if [ -n "${{ matrix.target_arch }}" ]; then
            npm run build:native --workspace @bradensbay/globals-shm -- --arch=${{ matrix.target_arch }}
          else
            npm run build:native
          fi
      - run: npm run build
      - name: smoke test the binary this machine built
        if: ${{ !matrix.target_arch }}
        run: node packages/shm/scripts/smoke.mjs
      - name: verify the cross built architecture
        if: ${{ matrix.target_arch }}
        shell: bash
        run: |
          file packages/shm/native/build/Release/globals_shm.node
          file packages/shm/native/build/Release/globals_shm.node | grep -q x86_64
      - name: stage the prebuild under its platform-arch name
        shell: bash
        run: |
          arch="${{ matrix.target_arch }}"
          if [ -z "$arch" ]; then arch="$(node -p 'process.arch')"; fi
          dest="packages/shm/native/prebuilds/$(node -p 'process.platform')-$arch"
          mkdir -p "$dest"
          cp packages/shm/native/build/Release/globals_shm.node "$dest/"
          echo "built $dest"
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.os }}${{ matrix.target_arch && format('-{0}', matrix.target_arch) || '' }}
          path: packages/shm/native/prebuilds/
