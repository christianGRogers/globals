name: ci

on:
  push:
    branches: [dev, main, "feature/**", "fix/**", "chore/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Electron types are needed to typecheck the integration package. The binary is not,
  # and downloading it on every job in a six way matrix costs minutes for nothing. The
  # electron-matrix workflow installs it properly where it is actually run.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check house style and link integrity
        run: node scripts/check-docs.mjs

  build:
    name: build and test, ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: build the native transport addon
        run: npm run build:native
      - name: typecheck and build
        run: npm run build
      - name: unit and property tests
        run: npm test

  spikes:
    name: phase 0 spikes that run without Electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: atomics torture, short run
        run: node spikes/run-spike.mjs 02 -- --workers 4 --seconds 3 --increments 20000
      - name: read latency
        run: node spikes/run-spike.mjs 04 -- --iterations 300 --batch 1000 --roundTrips 500

  sanitizers:
    name: address and undefined behaviour sanitizers over the addon
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # addon.c is the only file here that can corrupt memory, and until now nothing
      # mechanical read it: the fuzzer covers the decoder, the soak covers the protocol
      # statistically, and neither observes an out of bounds access in the C itself.
      #
      # ThreadSanitizer is deliberately absent. It finds races between threads inside one
      # process, and this transport's concurrency is between separate processes sharing a
      # mapping, which it cannot observe at all. GCC also refuses to instrument the standalone
      # fences this protocol is built on. The cross process soak remains the evidence for the
      # ordering, and it is statistical evidence, which the hardening note should say plainly.
      - name: build the addon under the sanitizers
        run: npm run build:native
        env:
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          LDFLAGS: "-fsanitize=address,undefined"
      - run: npm run build
      # Node is not itself built with sanitizers, so the runtime has to be interposed ahead
      # of it or ASan aborts before the first test. Leak detection stays off for the same
      # reason: every allocation Node makes and frees at exit would be reported, and none of
      # them are this addon's.
      - name: region and cross process tests under the sanitizers
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          node --test packages/shm/dist/test/region.test.js
          node --test packages/shm/dist/test/cross-process.test.js
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      - name: a short transport soak under the sanitizers
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          node packages/shm/test/soak/run-soak.mjs --readers 3 --seconds 20
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

  install-from-a-tarball:
    name: install the packed package the way a user would
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      # The risk register mitigated install friction with prebuilds, a compile fallback, and
      # "install tested in CI". Only the prebuilds existed. This is the third of those, and
      # it tests what users actually run: a packed tarball into an empty project.
      - name: pack, with a prebuild staged as a release would have
        run: |
          mkdir -p packages/shm/native/prebuilds/linux-x64 out
          cp packages/shm/native/build/Release/globals_shm.node packages/shm/native/prebuilds/linux-x64/
          npm pack --workspace @bradensbay/globals-core --workspace @bradensbay/globals-shm --pack-destination out
          ls -la out
      - name: glibc resolves the prebuild and compiles nothing
        run: |
          docker run --rm -v "$PWD/out:/in" node:22-bookworm-slim bash -c '
            set -e
            mkdir /t && cd /t && npm init -y > /dev/null
            npm install --no-audit --no-fund /in/*.tgz
            if [ -e node_modules/@bradensbay/globals-shm/native/build ]; then
              echo "::error::glibc fell back to a source build when a prebuild was available"
              exit 1
            fi
            node --input-type=module -e "
              const m = await import(\"@bradensbay/globals-shm\");
              if (m.LAYOUT_VERSION !== 2) process.exit(1);
              console.log(\"glibc loaded the prebuild\");
            "
          '
      # musl is the case that was silently broken: the prebuild key carried no libc, so
      # Alpine resolved the glibc binary and failed at the dynamic linker, which reads like a
      # corrupt package rather than an unsupported platform.
      - name: musl with a toolchain builds from source and works
        run: |
          docker run --rm -v "$PWD/out:/in" node:22-alpine sh -c '
            set -e
            apk add --no-cache python3 make g++ > /dev/null
            mkdir /t && cd /t && npm init -y > /dev/null
            npm install --foreground-scripts --no-audit --no-fund /in/*.tgz
            node --input-type=module -e "
              const { OwnerRegion, ReaderRegion } = await import(\"@bradensbay/globals-shm\");
              const size = 1 << 16;
              const owner = OwnerRegion.create(\"/tmp/ci.region\", size);
              owner.flush(new Uint8Array(size).fill(0x7e));
              const reader = ReaderRegion.attach(\"/tmp/ci.region\");
              const dest = new Uint8Array(size);
              reader.sync(dest);
              if (!dest.every((b) => b === 0x7e)) process.exit(1);
              console.log(\"musl built from source and round tripped\");
            "
          '
      # Without a toolchain the install must still succeed: npm install runs in images and
      # build layers that never load this code, and taking those down is worse than a clear
      # error where it is actually needed. The fallback also leans on the musl headers host,
      # which is less reliable than nodejs.org, so it must never be load bearing.
      - name: musl without a toolchain installs cleanly and explains itself at load
        run: |
          docker run --rm -v "$PWD/out:/in" node:22-alpine sh -c '
            set -e
            mkdir /t && cd /t && npm init -y > /dev/null
            npm install --no-audit --no-fund /in/*.tgz
            node --input-type=module -e "
              try {
                await import(\"@bradensbay/globals-shm\");
                console.error(\"expected the load to fail without a toolchain\");
                process.exit(1);
              } catch (error) {
                if (!/linux-x64-musl/.test(error.message) || !/toolchain/.test(error.message)) {
                  console.error(\"the message names neither the platform nor the toolchain:\", error.message);
                  process.exit(1);
                }
                console.log(\"install survived, and the load says what to do\");
              }
            "
          '

  smoke-soak:
    name: short soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm run build
      - name: transport soak, forty five seconds across real processes
        run: node packages/shm/test/soak/run-soak.mjs --readers 4 --seconds 45
      - name: ninety second soak, four readers
        run: node packages/core/dist/test/soak/run-soak.js --readers 4 --seconds 90
      - name: sixty second chaos run
        run: node packages/core/dist/test/soak/run-chaos.js --windows 6 --seconds 60
      - name: decoder fuzz, short run
        run: node packages/core/dist/test/fuzz/run-fuzz.js --iterations 1200
