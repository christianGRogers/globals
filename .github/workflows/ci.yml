name: ci

on:
  push:
    branches: [dev, main, "feature/**", "fix/**", "chore/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Electron types are needed to typecheck the integration package. The binary is not,
  # and downloading it on every job in a six way matrix costs minutes for nothing. The
  # electron-matrix workflow installs it properly where it is actually run.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check house style and link integrity
        run: node scripts/check-docs.mjs

  build:
    name: build and test, ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck and build
        run: npm run build
      - name: unit and property tests
        run: npm test

  spikes:
    name: phase 0 spikes that run without Electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: atomics torture, short run
        run: node spikes/run-spike.mjs 02 -- --workers 4 --seconds 3 --increments 20000
      - name: read latency
        run: node spikes/run-spike.mjs 04 -- --iterations 300 --batch 1000 --roundTrips 500

  smoke-soak:
    name: short soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: ninety second soak, four readers
        run: node packages/core/dist/test/soak/run-soak.js --readers 4 --seconds 90
      - name: sixty second chaos run
        run: node packages/core/dist/test/soak/run-chaos.js --windows 6 --seconds 60
      - name: decoder fuzz, short run
        run: node packages/core/dist/test/fuzz/run-fuzz.js --iterations 1200
