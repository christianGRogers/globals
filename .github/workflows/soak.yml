name: soak

# The soak is the release gate for anything that touches the arena or reclamation.
# It runs nightly and on demand, never on a pull request, because it is slow by design.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Duration in seconds
        default: "3600"
      readers:
        description: Reader count
        default: "8"

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  soak:
    name: soak, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: soak
        run: >
          node packages/core/dist/test/soak/run-soak.js
          --readers ${{ inputs.readers || '8' }}
          --seconds ${{ inputs.seconds || '3600' }}
          --report soak-results/${{ matrix.os }}.json
      - name: chaos
        run: >
          node packages/core/dist/test/soak/run-chaos.js
          --windows 8 --seconds 600
          --report soak-results/chaos-${{ matrix.os }}.json
      - name: decoder fuzz
        run: >
          node packages/core/dist/test/fuzz/run-fuzz.js
          --iterations 20000
          --seed ${{ github.run_number }}
          --report soak-results/fuzz-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: soak-results/
