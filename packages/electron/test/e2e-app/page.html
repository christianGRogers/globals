<!doctype html>
<meta charset="utf-8">
<title>e2e page</title>
<body>
<script type="importmap">
{
  "imports": {
    "@globals/core": "/packages/core/dist/src/index.js"
  }
}
</script>
<script type="module">
import { connect } from "../../dist/src/renderer.js";

const name = new URLSearchParams(location.search).get("name") ?? "page";
const say = (line) => console.log(`${name}: ${line}`);

const observation = { name, tier: null, errors: [] };

try {
  const store = await connect({ name });
  observation.tier = store.tier;
  observation.crossOriginIsolated = self.crossOriginIsolated === true;

  if (store.tier === "shared") {
    // The whole product: a synchronous read, on the line it is needed.
    const before = store.get();
    observation.readSynchronously = typeof before === "object" && before !== null;
    observation.sawRows = Array.isArray(before.rows) && before.rows.length === 500;
    observation.selectWorks = store.select(["rows", 3, "label"]) === "row 3";

    // The contract: a read on the line after a write still sees the old value.
    const counterBefore = store.select(["counter"]);
    const pending = store.dispatch("bump", { by: 5 });
    observation.readAfterWriteIsStale = store.select(["counter"]) === counterBefore;
    await pending;
    observation.readAfterAwaitIsFresh = store.select(["counter"]) > counterBefore;

    // A write from this window must be visible to every other window.
    const myRow = name === "shared-a" ? 10 : 20;
    await store.dispatch("setRow", { id: myRow, value: myRow * 100 });
    observation.ownWriteVisible = store.select(["rows", myRow, "value"]) === myRow * 100;
    observation.writtenRow = myRow;
  } else {
    observation.hasSynchronousGet = "get" in store;
    const value = await store.read();
    observation.asyncReadWorks = typeof value === "object" && value !== null;
    // A window on the async tier can still ask for a write.
    await store.dispatch("bump", { by: 1 });
    observation.dispatchWorks = true;
  }

  observation.ok = true;
  say(`done on the ${store.tier} tier`);
  await store.dispatch("observe", observation);
} catch (error) {
  observation.ok = false;
  observation.errors.push(`${error.name}: ${error.message}`);
  say(`FAILED: ${error.message}`);
  // Report through the owner if we can; if connect itself failed there is nothing to use.
  try {
    const fallback = await connect({ name });
    await fallback.dispatch("observe", observation);
  } catch {
    console.log(`UNREPORTABLE ${JSON.stringify(observation)}`);
  }
}
</script>
