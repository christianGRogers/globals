<!doctype html>
<meta charset="utf-8">
<title>chaos window</title>
<body>
<pre id="log"></pre>
<script type="module">
import { connect } from "../../dist/src/renderer.js";

const id = new URLSearchParams(location.search).get("id") ?? "0";
const log = (line) => { document.getElementById("log").textContent += line + "\n"; };

let reads = 0;
let inconsistent = 0;
let stale = 0;

const connection = await connect();
log(`bound on the ${connection.tier} tier`);

if (connection.tier === "shared") {
  setInterval(() => {
    for (let i = 0; i < 50; i += 1) {
      try {
        const snapshot = connection.snapshot();
        const state = snapshot.toJSON();
        reads += 1;
        // The invariant: the row the writer last touched must hold the tick that touched it.
        const row = state.rows[state.tick % state.rows.length];
        if (state.version !== state.tick) inconsistent += 1;
        else if (row && row.v !== state.tick) inconsistent += 1;
      } catch (error) {
        if (error.name === "StaleSnapshotError") stale += 1;
        else inconsistent += 1;
      }
    }
  }, 2);
}

// Report through the ordinary intent channel, continuously rather than at the end. This
// window may be killed without warning, so a report that only arrived at the end would
// never arrive at all. It also proves the intent path still works under the churn.
setInterval(() => {
  void connection
    .dispatch("observe", { id, tier: connection.tier, reads, inconsistent, stale })
    .catch(() => undefined);
}, 500);
</script>
